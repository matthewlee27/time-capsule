<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Time Capsule</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main id="app">
    <h1>Time Capsule</h1>
    <p>Turn your old listening habits into a new playlist.</p>

    <button id="start-btn">Start</button>

    <form id="username-form" class="hidden">
      <label for="username">Your Last.fm username</label>
      <input type="text" id="username" name="username" required autocomplete="off" />
      <button type="submit">Connect</button>
      <p id="connect-error" class="error hidden"></p>
    </form>

    <section id="pull-section" class="hidden">
      <p id="connected-as"></p>

      <label for="from-date">From (optional)</label>
      <input type="date" id="from-date" />

      <label for="to-date">To (optional)</label>
      <input type="date" id="to-date" />

      <button id="pull-btn">Pull my history</button>
      <p id="pull-status"></p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
